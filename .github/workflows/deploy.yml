name: Build & Deploy to EC2 (Docker Hub)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: devops-service

jobs:
  build-and-push:
    name: Multi-Arch Build & Push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Image Tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          SEMVER="1.0.${{ github.run_number }}"
          echo "version=${SEMVER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
     
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false   # <--- ADD THIS LINE (prevents Docker Hub upload hangs)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
     

  deploy:
    name: Deploy via AWS Systems Manager
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - name: Verify AWS Account and Region
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity
      
          echo "===== AWS Region ====="
          echo "$AWS_REGION"
      
      - name: Diagnose EC2 and SSM Instance
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
      
          echo "Checking EC2 instance: $INSTANCE_ID"
      
          echo "===== EC2 Instance Status ====="
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[].Instances[].{
              InstanceId:InstanceId,
              State:State.Name,
              Region:Placement.AvailabilityZone,
              IAMProfile:IamInstanceProfile.Arn
            }' \
            --output table
      
          echo "===== SSM Registration Status ====="
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'InstanceInformationList[].{
              InstanceId:InstanceId,
              PingStatus:PingStatus,
              AgentVersion:AgentVersion,
              Platform:PlatformName
            }' \
            --output table

      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
            TOKEN_JSON=$(curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
        
            TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
        
            if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
              echo "Failed to obtain GitHub OIDC token"
              exit 1
            fi
        
            python3 - "$TOKEN" <<'PY'
            import sys, json, base64
        
            token = sys.argv[1]
            payload = token.split('.')[1]
            payload += '=' * (-len(payload) % 4)
        
            claims = json.loads(
                base64.urlsafe_b64decode(payload)
            )
        
            for key in ['iss', 'aud', 'sub', 'repository', 'ref']:
                print(f"{key}: {claims.get(key)}")
            PY
      
      - name: Deploy Image to EC2 and Execute Rollback on Failure
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TARGET_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          echo "Dispatching deployment to EC2: $INSTANCE_ID"

          # Build the deployment script locally.
          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -Eeuo pipefail

          IMAGE="${IMAGE:?IMAGE is missing}"
          DH_USER="${DH_USER:?Docker Hub username is missing}"
          DH_TOKEN="${DH_TOKEN:?Docker Hub token is missing}"
          CONTAINER_NAME="devops-service"

          echo "Authenticating Docker with Docker Hub..."
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

          echo "Checking currently deployed image..."
          CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)

          echo "Pulling candidate image: $IMAGE"
          docker pull "$IMAGE"

          rollback() {
            echo "Restoring previous deployment..."
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            if [ -n "$CURRENT_IMAGE" ]; then
              echo "Rolling back to: $CURRENT_IMAGE"

              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p 8080:8080 \
                -e APP_PORT=8080 \
                -e APP_LOG_LEVEL=info \
                -e NODE_ENV=production \
                "$CURRENT_IMAGE"

              echo "Rollback completed."
            else
              echo "No previous image available for rollback."
            fi
          }

          echo "Removing previous container..."
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          echo "Starting updated container..."
          if ! docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8080:8080 \
            -e APP_PORT=8080 \
            -e APP_LOG_LEVEL=info \
            -e NODE_ENV=production \
            "$IMAGE"; then

            echo "New container failed to start."
            rollback
            exit 1
          fi

          echo "Checking application health..."
          SUCCESS=0

          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Health check passed on attempt $attempt."
              SUCCESS=1
              break
            fi

            echo "Waiting for application readiness ($attempt/10)..."
            sleep 3
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Health check failed."
            docker logs --tail 50 "$CONTAINER_NAME" || true
            rollback
            exit 1
          fi

          echo "Pruning unused Docker images..."
          docker image prune -f

          echo "Deployment completed successfully."
          SCRIPT
          )

          # Quote values safely for the remote POSIX shell.
          Q_IMAGE=$(jq -nr --arg v "$TARGET_IMAGE" '$v | @sh')
          Q_USER=$(jq -nr --arg v "$DH_USER" '$v | @sh')
          Q_TOKEN=$(jq -nr --arg v "$DH_TOKEN" '$v | @sh')

          # Explicitly execute the deployment script using Bash.
          REMOTE_COMMAND="IMAGE=$Q_IMAGE DH_USER=$Q_USER DH_TOKEN=$Q_TOKEN bash -s <<'SSM_SCRIPT'
          $DEPLOY_SCRIPT
          SSM_SCRIPT"

          # Generate valid JSON for the SSM commands parameter.
          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          echo "Sending deployment command to SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment execution..."

          # Do not exit immediately when the SSM waiter reports failure.
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"; then
            echo "SSM waiter reported deployment failure."
          fi

          # Retrieve the actual execution result.
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --output json)

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          EXIT_CODE=$(echo "$INVOCATION" | jq -r '.ResponseCode')

          echo "================================"
          echo "Deployment status: $STATUS"
          echo "Exit code: $EXIT_CODE"
          echo "================================"

          echo "$INVOCATION" | jq -r '.StandardOutputContent // ""'

          if [ "$STATUS" != "Success" ]; then
            echo "===== SSM ERROR OUTPUT ====="
            echo "$INVOCATION" | jq -r '.StandardErrorContent // ""'
            echo "Deployment FAILED."
            exit 1
          fi

          echo "Deployment and health verification completed successfully."


     
