name: Build & Deploy to EC2 (Docker Hub)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: devops-service

jobs:
  build-and-push:
    name: Multi-Arch Build & Push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Image Tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          SEMVER="1.0.${{ github.run_number }}"
          echo "version=${SEMVER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Full Stack via AWS Systems Manager
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Deploy Full Monitoring & App Stack to EC2
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TARGET_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          echo "Dispatching full-stack deployment to EC2: $INSTANCE_ID"

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
set -Eeuo pipefail

IMAGE="${IMAGE:?IMAGE is missing}"
DH_USER="${DH_USER:?Docker Hub username is missing}"
DH_TOKEN="${DH_TOKEN:?Docker Hub token is missing}"
APP_DIR="/opt/devops-stack"

echo "1. Ensuring 2GB Swap Memory (prevents OOM crash)..."
if [ ! -f /swapfile ]; then
  dd if=/dev/zero of=/swapfile bs=1M count=2048
  chmod 600 /swapfile
  mkswap /swapfile
  swapon /swapfile
  echo '/swapfile none swap sw 0 0' >> /etc/fstab
  echo "Swap file created successfully."
fi

echo "2. Installing git and Docker Compose plugin if missing..."
if command -v apt-get >/dev/null 2>&1; then
  export DEBIAN_FRONTEND=noninteractive
  apt-get update -y && apt-get install -y git curl
elif command -v dnf >/dev/null 2>&1; then
  dnf install -y git curl
elif command -v yum >/dev/null 2>&1; then
  yum install -y git curl
fi

if ! docker compose version >/dev/null 2>&1; then
  echo "Installing standalone Docker Compose CLI plugin..."
  mkdir -p /usr/local/lib/docker/cli-plugins
  curl -sSL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
  chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
fi

echo "3. Authenticating with Docker Hub..."
echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

echo "4. Syncing project repository to EC2..."
if [ ! -d "$APP_DIR" ]; then
  git clone https://github.com/udayantech/careguidebd-assessment.git "$APP_DIR"
else
  cd "$APP_DIR"
  git reset --hard
  git pull origin main
fi

cd "$APP_DIR"

echo "5. Updating container image reference..."
export TARGET_IMAGE="$IMAGE"
echo "TARGET_IMAGE=$IMAGE" > .env
echo "GRAFANA_ADMIN_USER=admin" >> .env
echo "GRAFANA_ADMIN_PASSWORD=AdminSecure2024!" >> .env

docker rm -f devops-service 2>/dev/null || true

echo "6. Pulling latest images for all monitoring services..."
docker pull "$IMAGE"
docker compose -f docker-compose.monitoring.yml pull

echo "7. Launching full monitoring & app stack..."
docker compose -f docker-compose.monitoring.yml up -d

echo "8. Running Smoke Test against /health endpoint..."
SUCCESS=0
for attempt in $(seq 1 15); do
  if curl -fsS http://127.0.0.1:8080/health 2>/dev/null | grep -q '"status":"UP"'; then
    echo "Smoke test passed on attempt $attempt."
    SUCCESS=1
    break
  fi
  echo "Waiting for stack readiness (attempt $attempt/15)..."
  sleep 4
done

if [ "$SUCCESS" -ne 1 ]; then
  echo "Health check failed! Printing container logs..."
  docker compose -f docker-compose.monitoring.yml logs --tail 50
  exit 1
fi

echo "Pruning dangling images..."
docker image prune -f

echo "Full Stack deployed and healthy!"
SCRIPT
)

          Q_IMAGE=$(jq -nr --arg v "$TARGET_IMAGE" '$v | @sh')
          Q_USER=$(jq -nr --arg v "$DH_USER" '$v | @sh')
          Q_TOKEN=$(jq -nr --arg v "$DH_TOKEN" '$v | @sh')

          REMOTE_COMMAND="IMAGE=$Q_IMAGE DH_USER=$Q_USER DH_TOKEN=$Q_TOKEN bash -s <<'SSM_SCRIPT'
$DEPLOY_SCRIPT
SSM_SCRIPT"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')

          echo "Sending deployment command to SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID. Waiting for execution..."

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"; then
            echo "SSM waiter finished."
          fi

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --output json)

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          echo "=== SSM Output ==="
          echo "$INVOCATION" | jq -r '.StandardOutputContent // ""'

          if [ "$STATUS" != "Success" ]; then
            echo "=== SSM Errors ==="
            echo "$INVOCATION" | jq -r '.StandardErrorContent // ""'
            echo "Deployment FAILED."
            exit 1
          fi

          echo "Deployment completed successfully!"
