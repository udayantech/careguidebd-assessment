name: Build & Deploy to EC2 (Docker Hub)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: devops-service

jobs:
  build-and-push:
    name: Multi-Arch Build & Push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Image Tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          SEMVER="1.0.${{ github.run_number }}"
          echo "version=${SEMVER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
     
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false   # <--- ADD THIS LINE (prevents Docker Hub upload hangs)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
     

  deploy:
    name: Deploy via AWS Systems Manager
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
            TOKEN_JSON=$(curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
        
            TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
        
            if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
              echo "Failed to obtain GitHub OIDC token"
              exit 1
            fi
        
            python3 - "$TOKEN" <<'PY'
            import sys, json, base64
        
            token = sys.argv[1]
            payload = token.split('.')[1]
            payload += '=' * (-len(payload) % 4)
        
            claims = json.loads(
                base64.urlsafe_b64decode(payload)
            )
        
            for key in ['iss', 'aud', 'sub', 'repository', 'ref']:
                print(f"{key}: {claims.get(key)}")
            PY
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Deploy Image to EC2 and Execute Rollback on Failure
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          TARGET_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DH_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"

          echo "Dispatching deployment command to EC2 target: $INSTANCE_ID"

          COMMAND_PAYLOAD=$(cat << 'EOF'
          set -e

          IMAGE="{{TARGET_IMAGE}}"
          DH_USER="{{DH_USER}}"
          DH_TOKEN="{{DH_TOKEN}}"
          CONTAINER_NAME="devops-service"

          echo "Authenticating instance Docker daemon against Docker Hub..."
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

          CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")

          echo "Pulling candidate image: $IMAGE..."
          docker pull "$IMAGE"

          echo "Stopping old container..."
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          echo "Starting updated container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8080:8080 \
            -e APP_PORT=8080 \
            -e APP_LOG_LEVEL=info \
            -e NODE_ENV=production \
            "$IMAGE"

          echo "Running Smoke Test against /health endpoint..."
          SUCCESS=0
          for attempt in $(seq 1 10); do
            if curl -s -f http://127.0.0.1:8080/health | grep -q '"status":"UP"'; then
              echo "Smoke test passed on attempt $attempt!"
              SUCCESS=1
              break
            fi
            echo "Waiting for service readiness (attempt $attempt/10)..."
            sleep 3
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test failed! Reverting to previous state..."
            docker logs --tail 50 "$CONTAINER_NAME"
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            if [ -n "$CURRENT_IMAGE" ]; then
              echo "Executing rollback to: $CURRENT_IMAGE"
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p 8080:8080 \
                -e APP_PORT=8080 \
                -e APP_LOG_LEVEL=info \
                -e NODE_ENV=production \
                "$CURRENT_IMAGE"
              echo "Rollback succeeded."
            else
              echo "Warning: No previous image found to rollback to."
            fi
            exit 1
          fi

          echo "Pruning untagged images..."
          docker image prune -f
          EOF
          )

          COMMAND_PAYLOAD="${COMMAND_PAYLOAD//\{\{TARGET_IMAGE\}\}/$TARGET_IMAGE}"
          COMMAND_PAYLOAD="${COMMAND_PAYLOAD//\{\{DH_USER\}\}/$DH_USER}"
          COMMAND_PAYLOAD="${COMMAND_PAYLOAD//\{\{DH_TOKEN\}\}/$DH_TOKEN}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(echo "$COMMAND_PAYLOAD" | jq -sR .)]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Execution ID: $COMMAND_ID. Waiting for output..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text)

          STDERR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text)

          echo "===== SSM Standard Output ====="
          echo "$OUTPUT"

          if [ "$STATUS" != "Success" ]; then
            echo "===== SSM Standard Error ====="
            echo "$STDERR"
            echo "Deployment FAILED with status: $STATUS"
            exit 1
          fi

          echo "Deployment and verification completed successfully."
