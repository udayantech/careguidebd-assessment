apiVersion: v1
kind: Service
metadata:
  name: devops-service
  namespace: devops-platform
  labels:
    app: devops-service
spec:
  type: NodePort                    
  ports:
    - port: 80                      # Internal cluster port
      targetPort: 8080              # Container port
      nodePort: 30080               # Port exposed directly on the Public IP
      protocol: TCP
      name: http
  selector:
    app: devops-service
